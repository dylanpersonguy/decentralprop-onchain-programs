[package]
name = "dispute"
version = "0.1.0"
description = "DecentralProp dispute_program — on-chain Merkle-proof verification + dispute lifecycle"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dispute"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "batch/idl-build", "challenge/idl-build"]

[lints]
workspace = true

[dependencies]
anchor-lang = "0.31.1"
solana-security-txt = "1.1.3"
batch = { path = "../batch", features = ["cpi"] }
challenge = { path = "../challenge", features = ["cpi"] }
